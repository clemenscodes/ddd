# The license gate.
#
# cargo-deny reads the SPDX license of every crate in the graph, on every
# target, and fails when one of them is not on the list below. It runs as the
# `licenses` check, so `nix flake check` is the gate and a leak cannot reach a
# release by being overlooked in a review.
#
# The reason it exists is that JoyMouse is MIT while some of the author's other
# crates are AGPL. Nothing prevents one of those from being pulled in by a new
# feature, and nothing about the build would complain. The binary would still
# work, the tests would still pass, and the promise the repository makes to
# whoever takes it under MIT would quietly be false. A list that has to be
# edited on purpose turns that into a build failure.
#
# GPL, AGPL and LGPL are absent from the list, which is what denies them. LGPL
# is denied on purpose too, because these binaries are linked statically and
# the relinking obligation cannot be met by a single executable.

[licenses]
# Below this, cargo-deny refuses to guess what a license file says and asks for
# a clarification instead. Guessing is the one thing a gate must not do.
confidence-threshold = 0.9

# Permissive, plus MPL-2.0. MPL is copyleft per file rather than per program,
# so using an unmodified MPL crate as a dependency carries no obligation beyond
# attribution, which the disclosure below provides.
#
# Adding an entry here is a deliberate act. Whoever adds one should be able to
# say why the license is acceptable for a binary that is also sold.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
]

# The workspace crates are checked like everything else rather than skipped.
# Skipping them is the usual setting and it would defeat the purpose here,
# because the leak this gate is built for is a first party crate under a
# license the product cannot carry.
private = { ignore = false }

exceptions = []
